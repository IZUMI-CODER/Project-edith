<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lens: glasses view</title>
<style>
  /* This page is what the WEARER sees: the real world (camera) with a small green display floating in the lens.
     On a real additive display black is transparent, so there is no box: only light on top of the world. */
  :root { --green: #6bff9c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; color: #fff; }
  #world { position: fixed; inset: 0; }
  video, #paper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #paper { display: none; background: radial-gradient(ellipse at 35% 25%, #34312d, #0b0a09 75%); }
  #sheet { position: absolute; left: 7%; right: 7%; top: 9%; bottom: 11%; background: #f6f3ea; border-radius: 3px; transform: rotate(-.6deg); box-shadow: 0 14px 40px rgba(0,0,0,.65);
    background-image: repeating-linear-gradient(180deg, transparent 0 33px, #cfd9ec 33px 34px); padding: 26px 22px 18px 70px; overflow: hidden; }
  #sheet::before { content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 2px; background: #eb9696; }
  #sheet small { display: block; font: 500 12px sans-serif; color: #6b7088; margin-bottom: 20px; }
  #prob { font: 500 clamp(22px, 3.6vw, 40px)/1.5 "DejaVu Sans", sans-serif; color: #1c2350; white-space: pre-wrap; overflow-wrap: anywhere; }
  #tint { position: absolute; inset: 0; background: rgba(0,0,0,.32); pointer-events: none; }            /* lens tint */
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5)); pointer-events: none; }

  #fov { position: fixed; right: 5vw; bottom: 8vh; width: min(52vw, 640px); aspect-ratio: 8 / 5; border: 1px dashed rgba(107,255,156,.45); border-radius: 6px; display: none; pointer-events: none; }
  .showfov #fov { display: block; }

  /* the display: 30 columns x 3 lines, lower outer corner of the right lens */
  #hud { position: fixed; right: calc(5vw + 22px); bottom: calc(8vh + 24px); font-size: clamp(15px, 2.15vw, 26px); line-height: 1.36; }
  #tp { width: 30ch; height: calc(3 * 1.36em); overflow: hidden; position: relative; }
  .back #tp { background: rgba(0,0,0,.72); outline: 10px solid rgba(0,0,0,.72); border-radius: 2px; }
  #tpin { }
  .line { white-space: pre; color: var(--green); text-shadow: 0 0 6px rgba(107,255,156,.85), 0 0 14px rgba(107,255,156,.35); }
  .line.answer { font-weight: 700; }
  .caret::after { content: "▌"; opacity: .9; animation: bl .8s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  #st { position: absolute; left: 0; bottom: calc(100% + 8px); font-size: .62em; letter-spacing: .18em; text-transform: uppercase; color: var(--green); opacity: .6; text-shadow: 0 0 6px rgba(107,255,156,.8); white-space: nowrap; }

  #help { position: fixed; left: 14px; top: calc(64px + env(safe-area-inset-top)); font-size: 12px; color: rgba(255,255,255,.7); max-width: min(520px, 90vw); line-height: 1.5; text-shadow: 0 1px 3px #000; }
  #help b { color: #fff; } #help.gone { display: none; }
  #typebox { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: none; gap: 8px; z-index: 9; }
  #typebox input { flex: 1; min-width: 0; font-family: inherit; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #335; background: rgba(0,0,0,.85); color: #fff; }
  #typebox button { font-family: inherit; font-size: 15px; padding: 0 16px; border-radius: 8px; border: 1px solid #3a6; background: #0d2418; color: var(--green); }
  #dbg { position: fixed; left: 10px; top: calc(64px + env(safe-area-inset-top)); margin: 0; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #9fe; background: rgba(0,0,0,.7); border-radius: 8px; max-width: min(460px, 92vw); white-space: pre-wrap; z-index: 6; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="world">
  <video id="video" playsinline muted autoplay></video>
  <div id="paper"><div id="sheet"><small id="ws">Worksheet 7</small><div id="prob"></div></div></div>
  <div id="tint"></div><div id="vig"></div>
</div>
<div id="fov"></div>
<div id="hud"><div id="st"></div><div id="tp"><div id="tpin"></div></div></div>
<div id="help">
  <b>Glasses view.</b> You see the room; only the green text is the display.<br>
  <span id="modeLine"></span><br>
  Keys: <b>space</b> pause · <b>d</b> debug · <b>↑ ↓</b> speed · <b>r</b> replay · <b>t</b> type a question · <b>b</b> dark backing · <b>f</b> show display area · <b>h</b> hide this
</div>
<div id="typebox"><input id="typein" placeholder="Type a question, press Enter" autocomplete="off"><button id="typego">Solve</button></div>
<pre id="dbg" style="display:none"></pre>
<script src="/static/detect.js"></script>
<script>
const SAMPLES = [{"label": "Integral, substitution", "shown": "∫ 2x·e^(x²) dx", "ok": true, "read_as": "∫ 2x·e^(x²) dx", "subject": "Calculus", "steps": ["Evaluate ∫ 2x·e^(x²) dx", "Substitution: let u = x².", "Then du = 2x dx.", "The integral becomes ∫ e^(u) du.", "Integrate in u: e^(u) + C.", "Back-substitute u = x².", "Answer: e^(x²) + C"], "verified": "pass"}, {"label": "Integral, by parts", "shown": "∫ x·cos(x) dx", "ok": true, "read_as": "∫ x·cos(x) dx", "subject": "Calculus", "steps": ["Evaluate ∫ x·cos(x) dx", "Integration by parts: ∫u dv = u·v − ∫v du.", "Let u = x, dv = cos(x) dx.", "Then du = 1 dx, v = sin(x).", "So the integral = x·sin(x) − ∫ sin(x) dx.", "The remaining integral is -cos(x).", "Answer: x·sin(x) + cos(x) + C"], "verified": "pass"}, {"label": "Derivative, chain rule", "shown": "d/dx [ sin(x³) ]", "ok": true, "read_as": "d/dx [ sin(x³) ]", "subject": "Calculus", "steps": ["Differentiate d/dx [ sin(x³) ]", "Chain rule. Outer function: sin(g), inner g = x³.", "Outer derivative: d/dg sin(g) = cos(g).", "Inner derivative: g' = 3x².", "Multiply: cos(x³) · 3x².", "Answer: 3x²cos(x³)"], "verified": "pass"}, {"label": "Derivative, quotient rule", "shown": "d/dx (x²+1)/(x−3)", "ok": true, "read_as": "d/dx [ (x² + 1)/(x - 3) ]", "subject": "Calculus", "steps": ["Differentiate d/dx [ (x² + 1)/(x - 3) ]", "Quotient rule: (u/v)' = (u'·v − u·v') / v².", "u = x² + 1, v = x - 3.", "u' = 2x, v' = 1.", "Numerator: -x² + 2x·(x - 3) - 1, over (x - 3)².", "Answer: 2x/(x - 3) - (x² + 1)/(x - 3)²"], "verified": "pass"}, {"label": "Limit, 0/0", "shown": "lim x→2  (x²−4)/(x−2)", "ok": true, "read_as": "lim x→2 of (x² - 4)/(x - 2)", "subject": "Calculus", "steps": ["Evaluate lim x→2 of (x² - 4)/(x - 2)", "Substituting x = 2 gives an indeterminate form, so simplify first.", "Cancel common factors: x + 2.", "Now substitute x = 2: 4.", "Answer: 4"], "verified": "pass"}, {"label": "Quadratic equation", "shown": "Solve  x² − 5x + 6 = 0", "ok": true, "read_as": "Solve x² - 5x + 6 = 0", "subject": "Algebra", "steps": ["Solve x² - 5x + 6 = 0", "Standard form: x² - 5x + 6 = 0.", "a = 1, b = -5, c = 6.", "Discriminant D = b² − 4ac = 1.", "D > 0: two real roots.", "x = (−b ± √D) / 2a.", "Answer: x = 2 or x = 3"], "verified": "pass"}, {"label": "Electron configuration, exception", "shown": "Write the electron configuration of Cr.", "ok": true, "read_as": "Electron configuration of Cr (Z = 24)", "subject": "Chemistry", "steps": ["Electron configuration of Cr", "Cr has Z = 24, so 24 electrons to place.", "Aufbau fill order: 1s 2s 2p 3s 3p 4s 3d.", "Fill in that order, max 2 e⁻ per orbital (s 2, p 6, d 10, f 14):", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁴", "Exception: Cr is more stable with half-filled or full d/f subshells, so it is", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d⁵", "Hund's rule: 4s [↑]  3d [↑][↑][↑][↑][↑]", "Unpaired electrons: 6.", "Noble-gas shorthand: [Ar] 4s¹ 3d⁵", "Answer: Cr: [Ar] 4s¹ 3d⁵"], "verified": "pass"}, {"label": "Electron configuration, ion", "shown": "Write the electron configuration of Fe²⁺.", "ok": true, "read_as": "Electron configuration of Fe2+ (Z = 26)", "subject": "Chemistry", "steps": ["Electron configuration of Fe2+", "Fe has Z = 26, so 24 electrons to place.", "Aufbau fill order: 1s 2s 2p 3s 3p 4s 3d.", "Neutral atom: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶", "Cation Fe2+: remove 2 e⁻ from the highest shell first (2 from 4s):", "1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶", "Hund's rule: 3d [↑↓][↑][↑][↑][↑]", "Unpaired electrons: 4.", "Noble-gas shorthand: [Ar] 3d⁶", "Answer: Fe2+: [Ar] 3d⁶"], "verified": "pass"}, {"label": "No elementary answer", "shown": "∫ e^(x²) dx", "ok": true, "read_as": "∫ e^(x²) dx", "subject": "Calculus", "steps": ["Evaluate ∫ e^(x²) dx", "This integrand has no elementary antiderivative:", "no combination of polynomials, e^x, logs and trig gives it.", "In special functions: √(π)·erfi(x)/2 + C", "Check the problem: is a factor missing (like 2x in front of e^(x²))?"], "verified": "pass"}, {"label": "Word problem (not covered)", "shown": "A ball is thrown at 20 m/s at 30° above the horizontal. Find the time of flight.", "ok": false, "reason": "this type of problem isn't covered offline yet (try a model backend, see docs/FREE.md)"}];
const $ = id => document.getElementById(id), video = $("video");
const SID = "glasses-" + Math.random().toString(36).slice(2);
let live = false, haveCamera = false, demoIdx = -1;

/* ---------------- teleprompter, 30 columns x 3 lines ---------------- */
const COLS = 30, tp = { steps: [], texts: [], els: [], i: 0, ch: 0, cps: 38, paused: false, running: false, hold: 0, acc: 0, last: 0 };
function wrap(text) {
  const out = []; let line = "";
  for (let w of text.split(" ")) {
    while (w.length > COLS) { if (line) { out.push(line); line = ""; } out.push(w.slice(0, COLS)); w = w.slice(COLS); }
    if (!line) line = w; else if ((line + " " + w).length <= COLS) line += " " + w; else { out.push(line); line = w; }
  }
  if (line) out.push(line); return out.join("\n");
}
const isAnswer = s => /^Answer/.test(s || "");
function start(steps) {
  tp.steps = steps; tp.texts = steps.map(wrap); tp.i = 0; tp.ch = 0; tp.hold = .3; tp.acc = 0; tp.paused = false; tp.els = [];
  const box = $("tpin"); box.innerHTML = "";
  steps.forEach(s => { const d = document.createElement("div"); d.className = "line" + (isAnswer(s) ? " answer" : ""); box.appendChild(d); tp.els.push(d); });
  $("tp").scrollTop = 0; if (!tp.running) { tp.running = true; tp.last = performance.now(); requestAnimationFrame(tick); }
}
function tick(now) {
  const dt = Math.min(.1, (now - tp.last) / 1000); tp.last = now;
  if (!tp.paused && tp.i < tp.steps.length) {
    if (tp.hold > 0) tp.hold -= dt;
    else {
      tp.acc += dt * tp.cps; const n = Math.floor(tp.acc); tp.acc -= n;
      const txt = tp.texts[tp.i]; tp.ch = Math.min(txt.length, tp.ch + n);
      const el = tp.els[tp.i]; el.textContent = txt.slice(0, tp.ch); el.classList.add("caret");
      const box = $("tp"); box.scrollTop = Math.max(0, el.offsetTop + el.offsetHeight - box.clientHeight);
      if (tp.ch >= txt.length) { el.classList.remove("caret"); tp.i++; tp.ch = 0; tp.hold = isAnswer(tp.steps[tp.i]) ? .7 : .3; if (tp.i >= tp.steps.length) st("done"); }
    }
  }
  requestAnimationFrame(tick);
}
const st = t => { $("st").textContent = t; };

/* ---------------- sending frames / questions to the tablet ---------------- */
const hdr = (extra = {}) => { const h = { "X-Session": SID, ...extra }; try { const c = localStorage.getItem("accessCode"); if (c) h["X-Access-Code"] = c; } catch (e) {} return h; };
async function postJSON(path, body) { const r = await fetch(path, { method: "POST", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) }); return r.json(); }
function handle(r, manual = false) {
  lastStatus = r.status;
  if (r.status === "solved") { st("solving"); start(r.steps); }
  else if (r.status === "unsupported") st(manual ? "can't solve this type" : "scanning");   // stay quiet when the camera just glances at random text
  else if (r.status === "error") { st(r.reason || "error"); if (/access code/.test(r.reason || "")) { try { localStorage.removeItem("accessCode"); } catch (e) {} } }
  else if (r.status === "nothing") st("scanning");
}
async function ask(text) {
  if (!live) { st("needs lite_server.py"); return; }
  st("solving"); handle(await postJSON("/api/solve", { text }), true);
}

/* ---------------- hands-free detection (shared with the main page: static/detect.js) ---------------- */
let det = null, lastStatus = "none", lastOcr = "";
async function sendFrame(force) {
  st("reading");
  try {
    const c = document.createElement("canvas"), sc = Math.min(1, 1280 / video.videoWidth); c.width = Math.round(video.videoWidth * sc); c.height = Math.round(video.videoHeight * sc);
    c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .85));
    const r = await (await fetch("/api/scan", { method: "POST", headers: hdr({ "Content-Type": "image/jpeg", ...(force ? { "X-Force": "1" } : {}) }), body: blob })).json();
    lastOcr = r.ocr || ""; handle(r, force); return r.status;
  } catch (e) { st("tablet unreachable"); return "error"; }
}
function onInfo(i) {
  if (!i.busy && lastStatus !== "solved") st(i.phase === "steady" ? "steady" : i.phase === "dark" ? "too dark" : i.phase === "focusing" ? "focusing" : i.still ? "hold steady" : "scanning");
  const dbg = $("dbg"); if (dbg.style.display !== "none") dbg.textContent =
    `phase    ${i.phase}\nmotion   ${i.d.toFixed(1)} (still below ${i.thr.toFixed(1)})\nstill    ${i.still} frames (need 3)\nsharp    ${i.sharp.toFixed(1)} / best ${i.best.toFixed(1)}\ncontrast ${i.contrast.toFixed(0)} (need 6)\nscans    ${i.scans}   last: ${i.last}\nOCR read: ${JSON.stringify(lastOcr).slice(0, 160)}`;
}

/* ---------------- demo mode: no server needed, sample solutions on a sample worksheet ---------------- */
function demo(i) {
  if (!SAMPLES[i]) return; demoIdx = i; const d = SAMPLES[i];
  $("prob").textContent = (i + 1) + ")  " + d.shown; st(d.ok ? "solving" : "can't solve this type");
  if (d.ok) start(d.steps); else { tp.steps = []; $("tpin").innerHTML = ""; }
}

/* ---------------- keys + input ---------------- */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Enter") { const v = e.target.value.trim(); if (v) { ask(v); e.target.value = ""; $("typebox").style.display = "none"; } } else if (e.key === "Escape") $("typebox").style.display = "none"; return; }
  if (e.key === " ") { e.preventDefault(); tp.paused = !tp.paused; }
  else if (e.key === "ArrowUp") tp.cps = Math.min(200, tp.cps * 1.25); else if (e.key === "ArrowDown") tp.cps = Math.max(8, tp.cps / 1.25);
  else if (e.key === "r" && tp.steps.length) start(tp.steps.slice());
  else if (e.key === "b") document.body.classList.toggle("back");
  else if (e.key === "f") document.body.classList.toggle("showfov");
  else if (e.key === "h") $("help").classList.toggle("gone");
  else if (e.key === "d") { const d = $("dbg"); d.style.display = d.style.display === "none" ? "block" : "none"; }
  else if (e.key === "t") { $("typebox").style.display = "flex"; $("typein").focus(); e.preventDefault(); }
  else if (/^[0-9]$/.test(e.key) && !haveCamera) demo(e.key === "0" ? 9 : +e.key - 1);
});
$("typego").onclick = () => { const v = $("typein").value.trim(); if (v) { ask(v); $("typein").value = ""; $("typebox").style.display = "none"; } };

/* ---------------- boot ---------------- */
(async () => {
  try {
    const r = await fetch("/api/status", { cache: "no-store" }); const j = r.ok ? await r.json() : {}; live = j.engine === "offline";
    if (live && j.needs_code) { let c = null; try { c = localStorage.getItem("accessCode"); } catch (e) {} if (!c) { c = prompt("Access code:"); if (c) { try { localStorage.setItem("accessCode", c); } catch (e) {} } } }
  } catch (e) { live = false; }
  if (live) {
    $("modeLine").innerHTML = "Live: point the camera at a problem and hold still. Or press <b>t</b> to type one.";
    try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } }, audio: false }); video.srcObject = s; await video.play(); haveCamera = true; st("scanning"); det = LensDetect.create({ video, send: sendFrame, onInfo }); }
    catch (e) { $("paper").style.display = "block"; $("modeLine").innerHTML = "No camera here, so showing a sample sheet. Press <b>t</b> to type a question, or <b>1</b>-<b>9</b> for samples."; $("modeLine").dataset.nocam = 1; demo(0); }
  } else {
    $("paper").style.display = "block"; $("modeLine").innerHTML = "Demo mode (no server running). Press <b>1</b>-<b>9</b> and <b>0</b> to look at different problems.";
    demo(0);
  }
})();
</script>
</body>
</html>
