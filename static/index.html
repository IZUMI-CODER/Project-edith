<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04090f">
<title>Lens</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<style>
  :root { --bg:#04090f; --cyan:#4df3ff; --dim:#1b8f99; --amber:#ffb340; --green:#5dff8f; --red:#ff5a5a; --text:#e2fbff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  #app { position:relative; height:100%; }
  video, #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #still { display:none; }
  #shade { position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); pointer-events:none; }

  /* reticle */
  .corner { position:absolute; width:46px; height:46px; border:2px solid var(--cyan); filter:drop-shadow(0 0 6px var(--cyan)); transition:all .25s; opacity:.85; }
  #c1 { top:14%; left:8%; border-right:0; border-bottom:0; } #c2 { top:14%; right:8%; border-left:0; border-bottom:0; }
  #c3 { bottom:14%; left:8%; border-right:0; border-top:0; } #c4 { bottom:14%; right:8%; border-left:0; border-top:0; }
  .reading .corner { border-color: var(--amber); filter:drop-shadow(0 0 8px var(--amber)); }
  .solved .corner { border-color: var(--green); filter:drop-shadow(0 0 8px var(--green)); }
  #sweep { position:absolute; left:8%; right:8%; height:3px; top:14%; display:none; background:linear-gradient(90deg,transparent,var(--amber),transparent);
    box-shadow:0 0 22px 6px rgba(255,179,64,.5); animation: sw 1.1s ease-in-out infinite alternate; }
  .reading #sweep { display:block; }
  @keyframes sw { from { top:14%; } to { top:86%; } }

  /* status chip */
  #top { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; gap:8px; pointer-events:none; }
  .chip { font-size:12px; letter-spacing:.22em; text-transform:uppercase; padding:6px 12px; border-radius:999px; background:rgba(4,9,15,.72);
    border:1px solid var(--dim); color:var(--cyan); text-shadow:0 0 8px var(--cyan); backdrop-filter:blur(4px); }
  .chip.ok { color:var(--green); border-color:var(--green); text-shadow:0 0 8px var(--green); }
  .chip.bad { color:var(--red); border-color:var(--red); }
  .chip.warn { color:var(--amber); border-color:var(--amber); }

  /* teleprompter */
  #tpwrap { position:absolute; left:0; right:0; bottom:0; height:58%; display:none; flex-direction:column; padding:0 max(14px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(4,9,15,0), rgba(4,9,15,.88) 22%, rgba(4,9,15,.94)); }
  .on #tpwrap { display:flex; }
  #readas { font-size:13px; color:var(--dim); padding:14px 4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #readas b { color:var(--text); font-weight:600; }
  #tp { flex:1; min-height:0; overflow:hidden; position:relative; scroll-behavior:smooth;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 14%, #000 100%); mask-image:linear-gradient(180deg, transparent 0, #000 14%, #000 100%); cursor:pointer; }
  #tpin { padding:30% 6px 40% 6px; }
  .line { font-size:clamp(20px, 2.7vw, 34px); line-height:1.45; margin:0 0 .55em; white-space:pre-wrap; word-break:break-word; color:#fff;
    text-shadow:0 0 10px rgba(77,243,255,.35); opacity:.42; transition:opacity .4s; }
  .line.cur { opacity:1; } .line.done { opacity:.55; }
  .line.answer { color:var(--green); text-shadow:0 0 12px rgba(93,255,143,.5); font-weight:700; }
  .caret::after { content:"▌"; color:var(--cyan); animation:bl .8s steps(1) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  #bar { display:flex; gap:6px; align-items:center; padding:6px 0; flex-wrap:wrap; }
  button { font:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); background:rgba(77,243,255,.08);
    border:1px solid var(--dim); border-radius:6px; padding:9px 12px; cursor:pointer; min-height:40px; }
  button:hover { background:rgba(77,243,255,.18); }
  #speed { font-size:12px; color:var(--dim); min-width:5.5em; text-align:center; }
  .spacer { flex:1; }

  /* glasses view: 3 lines x 30 columns, as a tiny HUD would show */
  .glasses #tpwrap { height:auto; left:50%; right:auto; transform:translateX(-50%); bottom:calc(70px + env(safe-area-inset-bottom)); background:none; padding:0; width:auto; }
  .glasses #readas { display:none; }
  .glasses #tp { width:calc(30ch + 40px); height:calc(3 * 1.35em + 12px); font-size:18px; background:#000; border:6px solid #111; border-radius:22px;
    -webkit-mask-image:none; mask-image:none; color:var(--green); }
  .glasses #tpin { padding:0 14px; }
  .glasses .line { font-size:18px; line-height:1.35; margin:0; color:var(--green); text-shadow:0 0 6px var(--green); opacity:1; white-space:pre; }
  .glasses .line.answer { font-weight:700; }
  .glasses #bar { justify-content:center; }

  #idlehelp { position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); text-align:center; font-size:13px; color:var(--dim); padding:0 20px; }
  .on #idlehelp { display:none; }
  #dock { position:absolute; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:6px; }
  .on #dock { display:none; }
  input[type=file] { display:none; }
  canvas#probe { display:none; }
</style>
</head>
<body>
<div id="app" class="">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <div id="shade"></div>
  <div class="corner" id="c1"></div><div class="corner" id="c2"></div><div class="corner" id="c3"></div><div class="corner" id="c4"></div>
  <div id="sweep"></div>

  <div id="top"><span class="chip" id="status">starting</span><span class="chip" id="badge" style="display:none"></span></div>

  <div id="idlehelp">Point at a problem and hold steady. It reads and solves on its own.</div>
  <div id="dock"><button id="typeBtn">Type</button><button id="uploadBtn">Upload</button><button id="glassesBtn0">Glasses view</button></div>

  <div id="tpwrap">
    <div id="readas"></div>
    <div id="tp"><div id="tpin"></div></div>
    <div id="bar">
      <button id="pauseBtn">❚❚ Pause</button>
      <button id="slow">A−</button><span id="speed"></span><button id="fast">A+</button>
      <button id="replay">↺ Replay</button>
      <span class="spacer"></span>
      <button id="typeBtn2">Type</button>
      <button id="glassesBtn">Glasses view</button>
      <button id="clearBtn">✕ Clear</button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment">
  <canvas id="probe"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);
const app = $("app"), video = $("video");
const SID = (() => { try { let s = localStorage.getItem("sid"); if (!s) { s = Math.random().toString(36).slice(2); localStorage.setItem("sid", s); } return s; } catch (e) { return "default"; } })();

/* ---------------- status ---------------- */
function setStatus(text, cls = "") { const c = $("status"); c.textContent = text; c.className = "chip " + cls; }
function mode(cls, on) { app.classList.toggle(cls, on); }

/* ---------------- API ---------------- */
function headers(extra = {}) {
  const h = { "X-Session": SID, ...extra };
  try { const c = localStorage.getItem("accessCode"); if (c) h["X-Access-Code"] = c; } catch (e) {}
  return h;
}
async function api(path, init) {
  let r = await fetch(path, init());
  if (r.status === 401) {
    const code = prompt("Access code:");
    if (code) { try { localStorage.setItem("accessCode", code); } catch (e) {} r = await fetch(path, init()); }
  }
  return r.json();
}
const sendImage = (blob, force) => api("/api/scan", () => ({ method: "POST", headers: headers({ "Content-Type": blob.type || "image/jpeg", ...(force ? { "X-Force": "1" } : {}) }), body: blob }));
const sendText = text => api("/api/solve", () => ({ method: "POST", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify({ text }) }));

/* ---------------- camera + stillness detector ---------------- */
const W = 96, H = 72, probe = $("probe"), pctx = probe.getContext("2d", { willReadFrequently: true });
probe.width = W; probe.height = H;
let prev = null, lastSent = null, still = 0, bestSharp = 1, busy = false, lastSendAt = 0, lastStatus = "none", haveCamera = false;
const STILL_MAX = 4.0, SCENE_MIN = 5.0, NEED_STILL = 4, RECHECK_MISS = 5000, RECHECK_HIT = 12000;

function thumb() {
  pctx.drawImage(video, 0, 0, W, H);
  const d = pctx.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
  for (let i = 0; i < g.length; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  return g;
}
const diff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; };
function sharpness(g) { let s = 0; for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) { const i = y * W + x; s += Math.abs(g[i] - g[i + 1]) + Math.abs(g[i] - g[i + W]); } return s / g.length; }

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } }, audio: false });
    video.srcObject = stream; await video.play(); haveCamera = true; setStatus("scanning");
    setInterval(detect, 250);
  } catch (e) {
    setStatus("no camera: use Upload or Type", "warn");
    $("idlehelp").textContent = "No camera access here. Use Upload (photo) or Type. Over http on a LAN address browsers block the camera; localhost works.";
  }
}

async function detect() {
  if (!haveCamera || video.readyState < 2 || !video.videoWidth) return;
  const t = thumb(), s = sharpness(t);
  bestSharp = Math.max(bestSharp * 0.985, s);
  const d = prev ? diff(t, prev) : 99; prev = t;
  still = d < STILL_MAX ? still + 1 : 0;
  if (busy) return;
  if (still < NEED_STILL) { if (lastStatus !== "solved") setStatus(still ? "hold steady" : "scanning"); return; }
  if (s < 0.75 * bestSharp) return;                       // out of focus / blurred: wait
  const changed = !lastSent || diff(t, lastSent) > SCENE_MIN;
  const age = performance.now() - lastSendAt;
  const stale = age > (lastStatus === "solved" || lastStatus === "same" ? RECHECK_HIT : RECHECK_MISS);
  if (changed || stale) { lastSent = t; scanFrame(); }
}

async function scanFrame() {
  busy = true; lastSendAt = performance.now(); mode("reading", true); setStatus("reading", "warn");
  try {
    const c = document.createElement("canvas"), sc = Math.min(1, 1280 / video.videoWidth);
    c.width = Math.round(video.videoWidth * sc); c.height = Math.round(video.videoHeight * sc);
    c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    handle(await sendImage(blob, false));
  } catch (e) { setStatus("tablet unreachable", "bad"); lastStatus = "error"; }
  busy = false; mode("reading", false);
}

function handle(r) {
  lastStatus = r.status;
  if (r.status === "solved") { mode("solved", true); setStatus("solving", "ok"); showSolution(r); }
  else if (r.status === "same") { if (!tp.running && !app.classList.contains("on")) setStatus("scanning"); }
  else if (r.status === "unsupported") { mode("solved", false); setStatus("can't solve this type yet", "warn"); }
  else if (r.status === "nothing") { setStatus("scanning"); }
  else if (r.status === "busy") { /* previous frame still being read */ }
  else { setStatus(r.reason || "error", "bad"); }
}

/* ---------------- teleprompter ---------------- */
const tp = { steps: [], i: 0, ch: 0, cps: 42, paused: false, running: false, hold: 0, acc: 0, last: 0, els: [], texts: [], cols: 0 };
function wrap(text, cols) {
  if (!cols) return text;
  const out = []; let line = "";
  for (let w of text.split(" ")) {
    while (w.length > cols) { if (line) { out.push(line); line = ""; } out.push(w.slice(0, cols)); w = w.slice(cols); }
    if (!line) line = w; else if ((line + " " + w).length <= cols) line += " " + w; else { out.push(line); line = w; }
  }
  if (line) out.push(line); return out.join("\n");
}
function buildTP() {
  const box = $("tpin"); box.innerHTML = ""; tp.els = []; tp.texts = tp.steps.map(s => wrap(s, tp.cols));
  tp.steps.forEach((s, k) => { const d = document.createElement("div"); d.className = "line" + (/^Answer/.test(s) ? " answer" : ""); box.appendChild(d); tp.els.push(d); });
}
function showSolution(r) {
  tp.steps = r.steps; tp.cols = app.classList.contains("glasses") ? 30 : 0; tp.i = 0; tp.ch = 0; tp.hold = 0.2; tp.acc = 0; tp.paused = false;
  $("pauseBtn").textContent = "❚❚ Pause";
  $("readas").innerHTML = "I read: <b></b>"; $("readas").querySelector("b").textContent = r.read_as;
  const badge = $("badge"); badge.style.display = "inline-block";
  badge.textContent = r.verified === "pass" ? "✓ verified" : r.verified === "fail" ? "⚠ check failed" : "unverified";
  badge.className = "chip " + (r.verified === "pass" ? "ok" : r.verified === "fail" ? "bad" : "");
  badge.title = r.verify_note || "";
  mode("on", true); buildTP(); speedLabel(); startLoop();
}
function startLoop() { tp.running = true; tp.last = performance.now(); requestAnimationFrame(tick); }
function tick(now) {
  if (!tp.running) return;
  const dt = Math.min(0.1, (now - tp.last) / 1000); tp.last = now;
  if (!tp.paused && tp.i < tp.steps.length) {
    if (tp.hold > 0) tp.hold -= dt;
    else {
      tp.acc += dt * tp.cps; const n = Math.floor(tp.acc); tp.acc -= n;
      const txt = tp.texts[tp.i]; tp.ch = Math.min(txt.length, tp.ch + n);
      tp.els.forEach((e, k) => { e.classList.toggle("cur", k === tp.i); e.classList.toggle("done", k < tp.i); });
      const el = tp.els[tp.i]; el.textContent = txt.slice(0, tp.ch); el.classList.add("caret");
      anchor(el);
      if (tp.ch >= txt.length) { el.classList.remove("caret"); tp.i++; tp.ch = 0; tp.hold = /^Answer/.test(tp.steps[tp.i] || "") ? 0.7 : 0.35; if (tp.i >= tp.steps.length) finished(); }
    }
  }
  requestAnimationFrame(tick);
}
function anchor(el) {
  const box = $("tp"), g = app.classList.contains("glasses");
  const target = g ? el.offsetTop + el.offsetHeight - box.clientHeight : el.offsetTop - box.clientHeight * 0.38;
  box.scrollTop = Math.max(0, target);
}
function finished() { setStatus("solved", "ok"); tp.els.forEach(e => e.classList.remove("cur")); }
function speedLabel() { $("speed").textContent = Math.round(tp.cps) + " ch/s"; }
function clearTP() { tp.running = false; mode("on", false); mode("solved", false); $("badge").style.display = "none"; setStatus("scanning"); lastStatus = "none"; lastSent = null; }

$("pauseBtn").onclick = () => { tp.paused = !tp.paused; $("pauseBtn").textContent = tp.paused ? "▶ Resume" : "❚❚ Pause"; };
$("tp").onclick = () => $("pauseBtn").click();
$("slow").onclick = () => { tp.cps = Math.max(8, tp.cps / 1.25); speedLabel(); };
$("fast").onclick = () => { tp.cps = Math.min(200, tp.cps * 1.25); speedLabel(); };
$("replay").onclick = () => { if (!tp.steps.length) return; tp.i = 0; tp.ch = 0; tp.hold = 0.2; tp.paused = false; $("pauseBtn").textContent = "❚❚ Pause"; buildTP(); if (!tp.running) startLoop(); setStatus("solving", "ok"); };
$("clearBtn").onclick = clearTP;
function toggleGlasses() {
  mode("glasses", !app.classList.contains("glasses")); const g = app.classList.contains("glasses");
  $("glassesBtn").textContent = $("glassesBtn0").textContent = g ? "Normal view" : "Glasses view";
  if (tp.steps.length) { const i = tp.i, ch = tp.ch; tp.cols = g ? 30 : 0; buildTP(); tp.texts.forEach((t, k) => { if (k < i) tp.els[k].textContent = t; }); tp.i = Math.min(i, tp.steps.length - 1); tp.ch = Math.min(ch, tp.texts[tp.i].length); }
}
$("glassesBtn").onclick = $("glassesBtn0").onclick = toggleGlasses;

/* ---------------- manual input fallbacks ---------------- */
async function typeProblem() { const t = prompt("Type or paste the problem:"); if (!t || !t.trim()) return; setStatus("solving", "ok"); const r = await sendText(t.trim()); handle(r); if (r.status === "unsupported") alert("Can't solve that offline yet: " + r.reason); }
$("typeBtn").onclick = $("typeBtn2").onclick = typeProblem;
$("uploadBtn").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return; setStatus("reading", "warn"); handle(await sendImage(f, true)); };

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); $("pauseBtn").click(); }
  else if (e.key === "ArrowUp" || e.key === "+") $("fast").click();
  else if (e.key === "ArrowDown" || e.key === "-") $("slow").click();
  else if (e.key === "Escape") clearTP();
  else if (e.key === "g") toggleGlasses();
  else if (e.key === "r") $("replay").click();
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
speedLabel(); startCamera();
</script>
</body>
</html>
