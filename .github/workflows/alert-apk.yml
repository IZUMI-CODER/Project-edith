name: Build Edith Alert APK

on:
  push:
    paths:
      - "alert-system/android/**"
      - ".github/workflows/alert-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alert-system/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same signing key every build, so a new APK installs over the old one
      # (a fresh runner would otherwise generate a new debug key each time).
      - uses: actions/cache@v4
        with:
          path: alert-system/android/ci-signing.keystore
          key: edith-alert-signing-v2

      - name: Create the signing key (first build only)
        run: |
          if [ ! -f ci-signing.keystore ]; then
            keytool -genkeypair -noprompt -keystore ci-signing.keystore -storepass edithalert \
              -keypass edithalert -alias edith -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Edith Alert"
          fi

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "REAL_FIREBASE=1" >> "$GITHUB_ENV"
          elif [ -f app/google-services.json ]; then
            echo "REAL_FIREBASE=1" >> "$GITHUB_ENV"
          else
            cp ci/google-services.placeholder.json app/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set, so this build only checks the code compiles. The APK would not receive alerts and is not uploaded."
          fi

      - name: Test and build
        run: |
          chmod +x gradlew
          # The run number is the app's versionCode, so the in-app updater sees each build as newer.
          ./gradlew --no-daemon -Pedith.versionCode=$((100 + ${{ github.run_number }})) testDebugUnitTest assembleDebug

      - name: Upload APK
        if: env.REAL_FIREBASE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: edith-alert-apk
          path: alert-system/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (fixed download link)
        if: env.REAL_FIREBASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EdithAlert.apk
          # Read by the app's updater (Updater.kt).
          printf '{"versionCode": %d, "apk": "https://github.com/%s/releases/latest/download/EdithAlert.apk"}\n' \
            $((100 + ${{ github.run_number }})) "${{ github.repository }}" > version.json
          gh release delete edith-alert-latest --yes --cleanup-tag || true
          gh release create edith-alert-latest EdithAlert.apk version.json \
            --target "$GITHUB_SHA" --latest \
            --title "Edith Alert APK" \
            --notes "Download EdithAlert.apk on the Android phone and tap it to install. Built from ${GITHUB_SHA::7}."
