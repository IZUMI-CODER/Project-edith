name = "edith-alert"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

# Set all four with `npx wrangler secret put NAME` (secrets survive redeploys;
# plain dashboard variables would be wiped by the next `wrangler deploy`). See ../README.md.
#   CODE_SECRET          random string; changing it invalidates every phone's code
#   FCM_SERVICE_ACCOUNT  Firebase service-account JSON, piped in whole
#   ACCESS_TEAM_DOMAIN   e.g. myteam.cloudflareaccess.com
#   ACCESS_AUD           the Access application's "Audience (AUD) tag"
